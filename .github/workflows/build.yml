name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Find and unzip the new project
        run: |
          rm -rf src_proj && mkdir src_proj
          FOUND=""
          for z in *.zip; do
            if unzip -l "$z" | grep -q NowPlayingActivity.kt; then FOUND="$z"; fi
          done
          if [ -z "$FOUND" ]; then echo "Naya zip nahi mila"; exit 1; fi
          echo "Using: $FOUND"
          unzip -o "$FOUND" -d src_proj
          D=$(dirname "$(find src_proj -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
